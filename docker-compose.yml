# Local development stack, matching the server's versions.
#
# Host ports are deliberately offset so this can run alongside XAMPP, which
# already holds 80 and 3306.
#
#   http://localhost:8080   application
#   127.0.0.1:3307          MySQL
#   127.0.0.1:6380          Redis

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexmile-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nexmile

  nginx:
    image: nginx:1.27-alpine
    container_name: nexmile-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - nexmile

  mysql:
    image: mysql:8.4
    container_name: nexmile-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: nexmile
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: nexmile
      MYSQL_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # The app waits for this: migrations against a half-started MySQL fail
      # in confusing ways.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - nexmile

  redis:
    image: redis:7-alpine
    container_name: nexmile-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    # Live state must not be silently evicted under memory pressure.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    networks:
      - nexmile

networks:
  nexmile:
    driver: bridge

volumes:
  mysql-data:
