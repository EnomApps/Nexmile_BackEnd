name: Deploy

# Only runs when CI has already passed on master, so a red build never reaches
# the server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Manual trigger, for redeploying without a new commit.
  workflow_dispatch:

concurrency:
  # Two deploys running at once would fight over the working tree.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Skip rather than fail while the secrets are still unset, so pushes
          # do not report a red build before deployment is configured.
          if [ -z "$SSH_HOST" ]; then
            echo "::notice::Deploy secrets not configured — skipping. See docs/DOCKER.md."
            echo "skipped=true" >> "$GITHUB_ENV"
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Pinning the host key stops a man-in-the-middle from receiving the
          # deploy key. Generate it once with: ssh-keyscan -H <host>
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" \
            'cd /var/www/nexmile && ./deploy.sh'

      - name: Verify the site is up
        if: env.skipped != 'true'
        run: |
          for url in https://nexmile.in/ https://api.nexmile.in/up; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || exit 1
          done
