name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      # Same major versions as production, so a migration that works here
      # works there.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nexmile_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip, exif, pcntl, redis
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations against MySQL
        # Catches schema errors that SQLite would silently tolerate.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexmile_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate --force --no-interaction

      - name: Verify migrations roll back cleanly
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nexmile_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate:rollback --force --no-interaction --step=100

      - name: Run test suite
        env:
          REDIS_CLIENT: phpredis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test
